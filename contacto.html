<h2>Contacto</h2>

<p class="texto-contacto">
    Si querés dejarme un mensaje, una opinión sobre mi página o simplemente saludarme,
    podés completar el siguiente formulario.
</p>

<form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" placeholder="Escribe tu nombre" required>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" placeholder="Escribe tu correo electrónico" required>

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" rows="6" placeholder="Escribe tu mensaje aquí..." required></textarea>

    <button type="submit">Enviar</button>
</form>

<footer>
    <p>© </p>
</footer>

</body>
